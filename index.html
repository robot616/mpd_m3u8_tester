<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>مختبر ومستخرج الإذاعات</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --primary: #00f2fe;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        
        body { 
            background-color: var(--bg); 
            color: var(--text); 
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
        }

        /* الهيدر العلوي وأزرار التحكم الشاملة */
        header {
            position: relative;
            text-align: center;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(0, 242, 254, 0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        h1 { margin: 0; color: var(--primary); font-size: 1.8rem; }

        .header-actions {
            position: absolute;
            left: 20px;
            display: flex;
            gap: 12px;
        }

        .header-btn {
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .global-stop-btn {
            background: #ef4444;
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4);
        }
        .global-stop-btn:hover { background: #dc2626; transform: scale(1.1); }

        .copy-all-btn {
            background: var(--primary);
            color: #000;
            box-shadow: 0 4px 10px rgba(0, 242, 254, 0.4);
        }
        .copy-all-btn:hover { background: #00c3cc; transform: scale(1.1); }

        .dashboard-container { 
            display: flex; 
            flex: 1; 
            padding: 20px; 
            gap: 15px; 
            overflow: hidden;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .right-panel {
            flex: 6.5;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .left-panel {
            flex: 3.5;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .card { 
            background: var(--card-bg); 
            padding: 15px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); 
            border: 1px solid rgba(0, 242, 254, 0.2); 
            display: flex;
            flex-direction: column;
        }

        .left-panel .card { flex: 1; overflow: hidden; padding: 15px 10px; }

        .card-title { font-size: 1.1rem; margin-bottom: 12px; color: var(--primary); display: flex; align-items: center; gap: 8px; font-weight: 900;}
        
        input[type="text"], textarea {
            width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #334155;
            background: #0b1120; color: white; font-size: 1rem; text-align: left; direction: ltr;
        }
        textarea { height: 180px; resize: none; flex-shrink: 0; margin-bottom: 12px; }
        input:focus, textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 5px rgba(0, 242, 254, 0.3); }

        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        button.action-btn {
            padding: 8px 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 6px; font-size: 0.95rem; flex: 1; justify-content: center;
        }
        .btn-primary { background: var(--primary); color: #000; }
        .btn-primary:hover { background: #00c3cc; transform: translateY(-2px); }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; transform: translateY(-2px); }
        .btn-secondary { background: #334155; color: white; }
        .btn-secondary:hover { background: #475569; transform: translateY(-2px); }

        .player-status { padding: 10px; border-radius: 8px; background: #000; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
        .status-text { color: #94a3b8; font-size: 0.9rem; }
        .status-playing { color: #22c55e; font-weight: bold; }
        .status-error { color: #ef4444; font-weight: bold; }

        .results-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #334155; }
        .count-badge { background: var(--primary); color: #000; padding: 3px 10px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
        
        #resultsList {
            flex: 1;
            overflow-y: auto;
            padding-right: 5px;
        }
        #resultsList::-webkit-scrollbar, .right-panel::-webkit-scrollbar { width: 5px; }
        #resultsList::-webkit-scrollbar-thumb, .right-panel::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .station-item {
            background: #0b1120; border: 1px solid #334155; padding: 10px; border-radius: 6px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px;
            transition: all 0.2s;
        }
        .station-item:hover { border-color: var(--primary); }
        
        .station-item.playing {
            border-color: var(--primary);
            background: rgba(0, 242, 254, 0.15);
        }
        .station-item.playing .station-name {
            color: var(--primary);
        }

        .station-info { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; transition: color 0.2s; }
        .station-name { font-weight: bold; color: #e2e8f0; font-size: 1rem; display: flex; align-items: center; gap: 8px; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .station-info:hover .station-name { color: var(--primary); }
        
        .station-actions { display: flex; gap: 5px; flex-shrink: 0; }
        .station-actions button { padding: 6px 10px; font-size: 0.85rem; flex: none; border-radius: 6px; }

        audio { width: 100%; outline: none; border-radius: 8px; }

        .empty-state { text-align: center; color: #64748b; margin-top: 40px; font-size: 1.1rem; }

        @media (max-width: 900px) {
            body { overflow: auto; }
            .dashboard-container { flex-direction: column; overflow: visible; height: auto; }
            .right-panel, .left-panel { flex: none; overflow: visible; }
            #resultsList { max-height: 500px; }
            .header-actions { left: 10px; }
            .header-btn { width: 35px; height: 35px; font-size: 1rem; }
            h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-satellite-dish"></i> مختبر ومستخرج الإذاعات</h1>
        <div class="header-actions">
            <button class="header-btn copy-all-btn" onclick="copyAllFormats()" title="نسخ أكواد جميع الإذاعات المستخرجة">
                <i class="fas fa-copy"></i>
            </button>
            <button class="header-btn global-stop-btn" onclick="globalStopAndClear()" title="إيقاف تام ومسح كل شيء">
                <i class="fas fa-power-off"></i>
            </button>
        </div>
    </header>

    <div class="dashboard-container">
        
        <div class="right-panel">
            
            <div class="card" style="gap: 10px;">
                <div class="card-title"><i class="fas fa-play-circle"></i> المشغل واختبار الروابط</div>
                
                <audio id="audioPlayer" controls></audio>
                
                <div class="player-status">
                    <span id="playerStatus" class="status-text">متوقف</span>
                    <span id="currentTestUrl" style="font-size: 0.8rem; color: #64748b; direction: ltr; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;"></span>
                </div>
                
                <input type="text" id="quickUrl" placeholder="الصق رابط الإذاعة هنا (مثال: http://stream.zeno.fm/...)">

                <div class="btn-group">
                    <button class="action-btn btn-primary" onclick="testQuickUrl()"><i class="fas fa-play"></i> تشغيل بالمشغل</button>
                    <button class="action-btn btn-danger" onclick="stopPlayer()"><i class="fas fa-stop"></i> إيقاف المشغل فقط</button>
                </div>
            </div>

            <div class="card">
                <div class="card-title"><i class="fas fa-code"></i> استخراج الروابط من نص أو M3U</div>
                <textarea id="extractInput" placeholder="الصق كود M3U بالكامل هنا، أو الصق أي نص عشوائي يحتوي على روابط ليتم استخراجها تلقائياً..."></textarea>
                <div class="btn-group">
                    <button class="action-btn btn-primary" onclick="extractStations()"><i class="fas fa-search"></i> استخراج الإذاعات</button>
                    <button class="action-btn btn-secondary" onclick="document.getElementById('extractInput').value=''"><i class="fas fa-trash"></i> مسح النص</button>
                </div>
            </div>

        </div>

        <div class="left-panel">
            <div class="card">
                <div class="results-header">
                    <div class="card-title" style="margin:0;"><i class="fas fa-list"></i> الإذاعات المستخرجة</div>
                    <div class="count-badge">العدد: <span id="stationCount">0</span></div>
                </div>
                
                <div id="resultsList">
                    <div class="empty-state">لم يتم استخراج أي إذاعات بعد.<br>الصق النص في المربع الأيمن واضغط "استخراج".</div>
                </div>
            </div>
        </div>

    </div>

<script>
    const audioPlayer = document.getElementById('audioPlayer');
    const playerStatus = document.getElementById('playerStatus');
    const currentTestUrl = document.getElementById('currentTestUrl');
    let hlsInstance = null;
    let currentExtractedStations = [];

    function playStream(url) {
        stopPlayer();
        currentTestUrl.textContent = url;
        playerStatus.textContent = "جاري الاتصال...";
        playerStatus.className = "status-text text-warning";

        if ((url.includes('.m3u8') || url.includes('.ts')) && Hls.isSupported()) {
            hlsInstance = new Hls();
            hlsInstance.loadSource(url);
            hlsInstance.attachMedia(audioPlayer);
            hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() {
                audioPlayer.play().catch(e => setPlayerError());
            });
            hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                if (data.fatal) setPlayerError();
            });
        } else {
            audioPlayer.src = url;
            audioPlayer.play().catch(e => setPlayerError());
        }
    }

    function removePlayingHighlight() {
        document.querySelectorAll('.station-item').forEach(item => {
            item.classList.remove('playing');
        });
    }

    function stopPlayer() {
        if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();
        playerStatus.textContent = "متوقف";
        playerStatus.className = "status-text";
        currentTestUrl.textContent = ""; 
        removePlayingHighlight();
    }

    function globalStopAndClear() {
        stopPlayer();
        document.getElementById('extractInput').value = '';
        document.getElementById('quickUrl').value = '';
        document.getElementById('resultsList').innerHTML = '<div class="empty-state">لم يتم استخراج أي إذاعات بعد.<br>الصق النص في المربع الأيمن واضغط "استخراج".</div>';
        document.getElementById('stationCount').textContent = '0';
        currentExtractedStations = [];
    }

    audioPlayer.addEventListener('playing', () => {
        playerStatus.textContent = "يعمل بنجاح";
        playerStatus.className = "status-text status-playing";
    });

    audioPlayer.addEventListener('error', setPlayerError);

    function setPlayerError() {
        playerStatus.textContent = "الرابط لا يعمل أو محمي";
        playerStatus.className = "status-text status-error";
    }

    function testQuickUrl() {
        const url = document.getElementById('quickUrl').value.trim();
        if (url) {
            playStream(url);
        }
    }

    function extractStations() {
        const text = document.getElementById('extractInput').value;
        const lines = text.split('\n');
        const stations = [];
        let tempName = '';

        for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;

            // 1. استخراج من صيغة M3U
            if (line.startsWith('#EXTINF')) {
                const parts = line.split(',');
                if (parts.length > 1) {
                    tempName = parts.slice(1).join(',').trim();
                } else {
                    tempName = 'إذاعة غير معروفة';
                }
            } 
            // 2. استخراج من صيغة الكود البرمجي (الآن يدعم k1 و k2)
            else if (line.includes('url:') && (line.includes('name:') || line.includes('{'))) {
                const nameMatch = line.match(/name:\s*["']([^"']+)["']/i);
                const urlMatch = line.match(/url:\s*["']([^"']+)["']/i);
                const k1Match = line.match(/k1:\s*["']([^"']+)["']/i);
                const k2Match = line.match(/k2:\s*["']([^"']+)["']/i);
                
                if (urlMatch) {
                    let stationObj = { 
                        name: nameMatch ? nameMatch[1].trim() : `رابط مستخرج ${stations.length + 1}`, 
                        url: urlMatch[1].trim() 
                    };
                    
                    // لو الشفرات موجودة ضيفهم للبيانات
                    if (k1Match && k2Match) {
                        stationObj.k1 = k1Match[1].trim();
                        stationObj.k2 = k2Match[1].trim();
                    }
                    
                    stations.push(stationObj);
                    tempName = '';
                }
            }
            // 3. استخراج الروابط المباشرة
            else if (line.startsWith('http://') || line.startsWith('https://')) {
                let finalUrl = line.split('#')[0].replace(/["',}]+$/, '').trim(); 
                const name = tempName || `رابط مستخرج ${stations.length + 1}`;
                stations.push({ name: name, url: finalUrl });
                tempName = ''; 
            }
        }

        // 4. الفلتر الشامل
        if (stations.length === 0) {
            const urlRegex = /(https?:\/\/[^\s"'<>},]+)/g;
            let match;
            while ((match = urlRegex.exec(text)) !== null) {
                let cleanUrl = match[1].replace(/["',}]+$/, '').trim();
                stations.push({ name: `رابط مستخرج ${stations.length + 1}`, url: cleanUrl });
            }
        }

        currentExtractedStations = stations; 
        renderResults(stations);
    }

    function renderResults(stations) {
        const resultsList = document.getElementById('resultsList');
        const stationCount = document.getElementById('stationCount');

        resultsList.innerHTML = '';
        stationCount.textContent = stations.length;

        if (stations.length === 0) {
            resultsList.innerHTML = '<div class="empty-state" style="color:#ef4444;">لم يتم العثور على أي روابط صالحة. تأكد من النص المدخل.</div>';
            return;
        }

        stations.forEach((station, index) => {
            const item = document.createElement('div');
            item.className = 'station-item';
            item.id = 'station-' + index;
            
            const cleanUrl = station.url.replace(/"/g, '&quot;');
            
            // تحديد إذا كان يوجد شفرة لطباعة علامة قفل
            const drmIcon = (station.k1 && station.k2) ? ' <i class="fas fa-lock" style="color: #f59e0b; font-size: 0.8rem;" title="قناة مشفرة"></i>' : '';
            
            // تحضير بارامترات النسخ
            const k1Arg = station.k1 ? `'${station.k1}'` : 'null';
            const k2Arg = station.k2 ? `'${station.k2}'` : 'null';
            
            item.innerHTML = `
                <div class="station-info" onclick="testExtracted('${cleanUrl}', ${index})" title="تشغيل الرابط">
                    <div class="station-name"><i class="fas fa-play-circle"></i> ${station.name}${drmIcon}</div>
                </div>
                <div class="station-actions">
                    <button class="action-btn btn-secondary" onclick="copyFormat('${station.name.replace(/'/g, "\\'")}', '${cleanUrl}', ${k1Arg}, ${k2Arg})" title="نسخ كود الإضافة"><i class="fas fa-code"></i></button>
                    <button class="action-btn btn-secondary" onclick="copyUrl('${cleanUrl}')" title="نسخ الرابط فقط"><i class="fas fa-link"></i></button>
                </div>
            `;
            resultsList.appendChild(item);
        });
    }

    function testExtracted(url, index) {
        document.getElementById('quickUrl').value = url;
        testQuickUrl();
        
        removePlayingHighlight();
        const activeItem = document.getElementById('station-' + index);
        if(activeItem) activeItem.classList.add('playing');
    }

    // تم تحديث الدالة لتدعم k1 و k2
    function copyFormat(name, url, k1, k2) {
        let format = `{ name: "${name}", url: "${url}"`;
        if (k1 && k2 && k1 !== 'null' && k2 !== 'null') {
            format += `, k1: "${k1}", k2: "${k2}"`;
        }
        format += ` },`;
        
        navigator.clipboard.writeText(format).then(() => {
            alert("تم نسخ سطر الكود الجاهز للإضافة!");
        });
    }

    function copyUrl(url) {
        navigator.clipboard.writeText(url).then(() => {
            alert("تم نسخ الرابط بنجاح!");
        });
    }

    // تم تحديث الدالة لتدعم الشفرات
    function copyAllFormats() {
        if (currentExtractedStations.length === 0) {
            alert("لا يوجد أي إذاعات مستخرجة لنسخها!");
            return;
        }
        
        const allCodes = currentExtractedStations.map(station => {
            let line = `{ name: "${station.name.replace(/"/g, '\\"')}", url: "${station.url}"`;
            if (station.k1 && station.k2) {
                line += `, k1: "${station.k1}", k2: "${station.k2}"`;
            }
            line += ` },`;
            return line;
        }).join('\n');

        navigator.clipboard.writeText(allCodes).then(() => {
            alert(`تم نسخ أكواد ${currentExtractedStations.length} إذاعة بنجاح!`);
        });
    }
</script>
</body>
</html>
